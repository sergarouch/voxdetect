[project]
name = "voxdetect"
version = "0.1.0"
description = "Voice activity detection: import audio, train a small neural net, and score new clips."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "torch>=2.2",
    "torchaudio>=2.2",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[project.scripts]
voxdetect = "voxdetect.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxdetect = ["collect/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
