<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voxdetect</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307080d' width='32' height='32'/%3E%3Crect fill='%23ff6a00' x='6' y='8' width='4' height='16'/%3E%3Crect fill='%23ffb067' x='14' y='12' width='4' height='8'/%3E%3Crect fill='%23fff4ea' x='22' y='6' width='4' height='20'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="mast">
    <p class="brand">VOX<span>DETECT</span></p>
    <p class="catalog-no">ANON</p>
  </header>

  <main>
    <section class="intro">
      <h1>4 seconds.</h1>
      <p class="deck">No name. No account.</p>
    </section>

    <section class="guide" aria-labelledby="guide-title">
      <h2 id="guide-title">Record</h2>
      <div id="howto" class="howto-grid">
        <p class="hint">Loading…</p>
      </div>
    </section>

    <section class="studio" id="studio" aria-busy="true">
      <p id="loading">Loading…</p>
      <div id="workspace" hidden>
        <div class="tasks" role="group" aria-label="Label">
          <button type="button" class="task" data-label="silence" aria-pressed="false"><span>01</span>Silence</button>
          <button type="button" class="task" data-label="noise" aria-pressed="false"><span>02</span>Noise</button>
          <button type="button" class="task" data-label="english" aria-pressed="false"><span>03</span>English</button>
          <button type="button" class="task" data-label="non_english" aria-pressed="false"><span>04</span>Other language</button>
        </div>

        <div id="detail" class="detail" hidden></div>

        <div id="capture" class="capture" hidden>
          <div class="capture-actions">
            <button type="button" id="record" class="primary">Record 4s</button>
            <label class="upload">
              Upload
              <input id="file" type="file" accept="audio/*,video/webm">
            </label>
          </div>
          <p id="capture-status" class="hint">4s.</p>
          <canvas id="meter" width="640" height="48" aria-hidden="true"></canvas>
          <audio id="preview" controls hidden></audio>
        </div>

        <label class="consent">
          <input id="consent" type="checkbox">
          <span>No names. OK to train on this clip.</span>
        </label>

        <pre id="card" class="card" aria-label="Label that will be stored"></pre>
        <p id="form-error" class="error" role="alert" hidden></p>
        <div class="send-row">
          <button type="button" id="submit" class="primary" disabled>Send</button>
          <button type="button" id="reset" class="quiet" hidden>Discard</button>
        </div>
        <p id="send-hint" class="hint">Pick one.</p>
        <div id="receipt" class="receipt" hidden></div>
      </div>
    </section>

    <section class="stats" aria-labelledby="stats-title">
      <h2 id="stats-title">Count</h2>
      <dl id="stats">
        <div><dt>Total</dt><dd>—</dd></div>
      </dl>
    </section>
  </main>

  <footer>
    <p>4s. No playback.</p>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
